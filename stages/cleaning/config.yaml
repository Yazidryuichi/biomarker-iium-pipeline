# Stage 1: Cleaning
# =================
# input.from: raw_edf      → reads from globals.paths.edf_dir
# output.to:  cleaning      → writes to results/cleaning/<YYYY-MM-DD_HHMMSS>/

input:
  from: raw_edf

output:
  to: cleaning

params:
  bandpass: [0.5, 45.0]
  notch: 50.0
  epoch_duration: 2.0       # seconds
  epoch_overlap: 0.0
  ica_method: "fastica"
  ica_n_components: 14      # n_channels - 1
  # Conservative rejection (SCCN recommendation for small N)
  max_reject_pct: 0.30      # reject max 30% of epochs
  bad_channel_threshold: 3.0  # z-score
