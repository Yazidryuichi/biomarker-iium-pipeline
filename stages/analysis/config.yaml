# Stage 4: Analysis (regression-first, post-hoc clinical thresholding)
# =====================================================================
# input.from: engineering   → reads latest stages/engineering/runs/<ts>/full_dataset.csv
# output.to:  analysis      → writes to stages/analysis/runs/<YYYY-MM-DD_HHMMSS>/
#
# This stage is REGRESSION-FIRST. The continuous target (default:
# DDM incongruent drift rate, age-residualized) is modelled directly;
# binary at-risk labels are derived post-hoc by cutting the
# residualized target at a fixed quantile and used only to compute
# clinical-screening metrics from cross_val_predict outputs.
#
# Set legacy_classification.enable: true to also run the old
# binary-classification path (backwards-compat sensitivity analysis).

input:
  from: engineering

output:
  to: analysis

params:
  # ----- Unsupervised feature curation (runs once on full cohort) -----
  # Unsupervised steps cannot leak labels, so they are safe to apply
  # before the CV split. Drops near-constant columns then collapses
  # tightly correlated clusters to a single representative.
  feature_curation:
    enable: true
    variance_threshold: 1.0e-6
    collinearity_threshold: 0.95
    save_diagnostics: true

  # ----- Target variables -----
  # Each name must be a continuous column in full_dataset.csv produced
  # by stage engineering. Outputs per target land in
  #   stages/analysis/runs/<ts>/<target>/   (when len(names) > 1)
  #   stages/analysis/runs/<ts>/             (when len(names) == 1)
  #
  # task: 'regression' is the default; 'classification' falls back to
  # the legacy median-split + classifier path.
  #
  # residualize_covariates: regressed out of every target before CV.
  # Default 'age_months' is materialised by stage engineering from DoB.
  target:
    task: regression
    residualize_covariates: [age_months]
    clinical_threshold:
      method: tertile_bottom            # 33rd percentile (lower residual = at-risk)
      sensitivity_methods: [median, quartile_bottom]
    names:
      - Global_EF
      - IC_score
      - WM_score
      - BW_Span
      - ddm_v_incongruent
      - ddm_delta_v

  # ----- Models -----
  # Default lineup is regression. Names map to factories in
  # stages/analysis/analysis.py:_build_regressors. Comment a line to
  # disable. Available legacy classifiers are listed in
  # legacy_classification.models below.
  models:
    - LassoCV
    - ElasticNetCV
    - RandomForestRegressor
    # Available, disabled for paper-ready lineup:
    # - SVR
    # - GradientBoostingRegressor

  # ----- Cross-validation -----
  # RepeatedKFold (NOT stratified) for regression — there is no class
  # label to balance across folds. n_splits * n_repeats = total folds.
  cv:
    type: RepeatedKFold
    n_splits: 5
    n_repeats: 5
    random_state: 42

  # ----- Optional univariate filter -----
  # Disabled by default because L1 (LassoCV) and ElasticNetCV already
  # do supervised selection inside the pipeline. Enable for tree-only
  # lineups if feature count is unwieldy after curation.
  univariate_filter:
    enable: false
    method: mutual_info_regression
    k_adaptive: true

  # ----- Statistical validation -----
  validation:
    permutation_n: 200
    bootstrap_n: 1000
    fdr_method: fdr_bh                  # Benjamini-Hochberg

  # ----- Legacy classification path (backwards compatibility) -----
  # When enabled, the pipeline ALSO runs the pre-refactor
  # median-split + classifier flow on the same target. Use as a
  # sanity-check; the regression flow is the primary analysis.
  legacy_classification:
    enable: false
    cv_folds: 5
    cv_repeats: 5
    include_qsvm: false
    models:
      - RandomForest
      - SVM
    feature_sets:
      - conventional_qeeg
      - all_features

  # ----- Feature sets (used by both paths) -----
  # Comment out lines to skip a set. The regression path applies
  # feature curation first, then runs each enabled feature set
  # through the regressor lineup.
  feature_sets:
    - conventional_qeeg
    - conventional_qeeg_ec
    - covariance_only_ec
    - all_features
    # - conventional_plus_advanced
    # - covariance_only
    # - conventional_qeeg_eo
    # - conventional_plus_advanced_eo
    # - conventional_plus_advanced_ec
    # - covariance_only_eo
    # - all_features_eo
    # - all_features_ec
    # - quantum_only            # requires features.include_quantum=true
    # - classical_plus_quantum  # requires features.include_quantum=true
