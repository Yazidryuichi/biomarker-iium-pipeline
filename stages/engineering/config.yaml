# Stage 3: Feature Engineering + Behavioral Merge
# ================================================
# input.from: features      → reads latest stages/features/runs/<ts>/features.csv
# output.to:  engineering   → writes to stages/engineering/runs/<YYYY-MM-DD_HHMMSS>/

input:
  from: features

output:
  to: engineering

params:
  # TBR channels (theta/beta ratio per channel + frontal mean)
  tbr_channels: ["Fz", "F3", "F4", "Cz"]
  # Frontal Alpha Asymmetry: ln(alpha_<right>) - ln(alpha_<left>)
  faa_left:  "F3"
  faa_right: "F4"
  # Posterior channels for alpha-reactivity
  posterior_alpha_channels: ["O1", "O2", "Pz"]
  # Behavioral assessment date (used to compute age from DoB)
  assessment_date: "2026-03-09"
