# Biomarker_IIUM Analysis Pipeline Configuration
# ================================================

paths:
  edf_dir: "./EF_Biomarker/EDF_Files"
  behavioral_dir: "./data_root"
  output_dir: "./results"
  figures_dir: "./figures"

recording:
  sfreq: 250  # Hz
  n_channels: 15
  channels:
    - Fp1
    - Fp2
    - F7
    - F3
    - Fz
    - F4
    - F8
    - C3
    - Cz
    - C4
    - P3
    - Pz
    - P4
    - O1
    - O2
  conditions:
    primary:
      - Eyes_Open
      - Eyes_Closed
    emotional:
      - 1_Happy
      - 2_Calm
      - 3_Sad
      - 4_Scare

cleaning:
  bandpass: [0.5, 45.0]
  notch: 50.0
  epoch_duration: 2.0  # seconds
  epoch_overlap: 0.0
  ica_method: "fastica"
  ica_n_components: 14  # n_channels - 1
  # Conservative rejection (SCCN recommendation for small N)
  max_reject_pct: 0.30  # reject max 30% of epochs
  bad_channel_threshold: 3.0  # z-score

features:
  # Frequency bands
  bands:
    delta: [1, 4]
    theta: [4, 8]
    alpha: [8, 13]
    beta: [13, 30]
  # TBR channels
  tbr_channels: ["Fz", "F3", "F4", "Cz"]
  # FAA channels
  faa_left: "F3"
  faa_right: "F4"
  # Coherence pairs
  coherence_pairs:
    - ["Fz", "Pz"]
    - ["F3", "P3"]
    - ["F4", "P4"]
  # Wavelet parameters
  wavelet: "cmor1.5-1.0"
  wavelet_n_freqs: 30
  wavelet_freq_range: [2, 45]

ml:
  cv_folds: 5
  cv_repeats: 10
  random_state: 42
  test_size: 0.2
  models:
    - RandomForest
    - XGBoost
    - LightGBM
    - CatBoost
    - SVM
    - KNN
    - MLP
    - CNN-LSTM
  scoring:
    - balanced_accuracy
    - f1
    - roc_auc
    - sensitivity
    - specificity

# Stage 5 fair-comparison hyperparameters (matched 2x2: feature set x model class).
# Defaults below are the canonical research-grade settings used for the headline
# results in README. CI / smoke-test workflows can override via CI_FAST=1 env var
# (which reduces n_perm to 10 and n_boot to 200, bringing Stage 5 from ~1+ hour
# to ~2 min on the synthetic fixture). Real-data runs should never set CI_FAST.
stage5:
  n_select: 10       # SelectKBest k for the matched preprocessing pipeline
  n_splits: 10       # RepeatedStratifiedKFold splits
  n_repeats: 10      # RepeatedStratifiedKFold repeats -> 100 folds total
  random_state: 42
  n_boot: 10000      # subject-bootstrap resamples for CIs
  n_perm: 1000       # label-permutation count for per-cell p-values
  ci_fast_n_boot: 200    # CI_FAST=1 override for n_boot
  ci_fast_n_perm: 10     # CI_FAST=1 override for n_perm
