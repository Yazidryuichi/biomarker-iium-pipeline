# Biomarker_IIUM Analysis Pipeline — Globals
# ============================================
# Stage-specific config lives in stages/<stage>/config.yaml. This file
# holds only values that more than one stage reads (paths, recording
# parameters, the global random seed).
#
# Stage I/O model
# ---------------
# Each stage declares input.from and output.to in its own config and
# writes to results/<output.to>/<YYYY-MM-DD_HHMMSS>/. Predecessors are
# auto-resolved to the latest sibling subdir at run time. There is no
# shared "run dir".

paths:
  # Input data
  edf_dir: "./data/EDF"
  behavioral_dir: "./data"
  # Output root: each stage writes to results/<stage>/<timestamp>/
  results_dir: "./results"

recording:
  sfreq: 250  # Hz
  n_channels: 15
  channels:
    - Fp1
    - Fp2
    - F7
    - F3
    - Fz
    - F4
    - F8
    - C3
    - Cz
    - C4
    - P3
    - Pz
    - P4
    - O1
    - O2
  conditions:
    primary:
      - Eyes_Open
      - Eyes_Closed
    emotional:
      - 1_Happy
      - 2_Calm
      - 3_Sad
      - 4_Scare

# Global RNG seed (numpy, random, PYTHONHASHSEED, ICA, sklearn CV).
random_state: 42
