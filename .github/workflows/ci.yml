name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same ref when new commits arrive. Prevents
# runaway old runs from holding up feedback on the current commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-unit:
    name: Unit tests (density-matrix invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/test_density_matrix.py -v

  test-end-to-end:
    name: End-to-end pipeline against synthetic fixture
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install pytest

      - name: Generate synthetic fixture (small N for CI smoke test)
        # N=12 instead of N=28 — CI is a smoke test ("does the pipeline run
        # without crashing"), not a statistical run. On N=28 the pipeline
        # took 1+ hour in CI runner; N=12 should keep it under 10 min.
        # 6-per-class minimum is comfortable for the 5-fold stratified CV
        # (config.yaml `cv_folds: 5` needs ≥5 samples per class to fit).
        # The fixture generator is identical to the local Makefile target;
        # only the subject count differs.
        run: |
          python tests/generate_synthetic_fixture.py \
            --out tests/fixtures/synthetic \
            --n-subjects 12 \
            --seed 42

      - name: Run pipeline end-to-end on fixture
        # set -o pipefail so a non-zero exit from python propagates through tail
        # (without it, tail returns 0 and masks pipeline failures as ✓).
        # SKIP_SHAP=1: SHAP tree explainer can stall on synthetic-fixture
        # inputs (observed 40+ min hang at Stage 4C with shap==0.49.1 on the
        # 28-subject gaussian-noise fixture). Real-data runs do not set this.
        env:
          SKIP_SHAP: '1'
        run: |
          set -o pipefail
          python run_all.py --config tests/fixtures/synthetic/config.fixture.yaml \
            2>&1 | tail -200

      - name: Regenerate figures from Stage 5 output
        run: |
          python generate_figures.py \
            --results-dir tests/fixtures/synthetic/results \
            --out-dir tests/fixtures/synthetic/figures

      - name: Upload figures as artifact
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: ci-figures
          path: tests/fixtures/synthetic/figures/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload results JSON as artifact
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: ci-results
          path: tests/fixtures/synthetic/results/*.json
          if-no-files-found: warn
          retention-days: 14
