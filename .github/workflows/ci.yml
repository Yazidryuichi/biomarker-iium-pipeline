name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same ref when new commits arrive. Prevents
# runaway old runs from holding up feedback on the current commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-unit:
    name: Unit tests (density-matrix invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/test_density_matrix.py -v

  test-end-to-end:
    name: End-to-end pipeline against synthetic fixture
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install pytest

      - name: Generate synthetic fixture (small N + short duration for CI smoke test)
        # N=20 — Stage 5 fair_comparison hardcodes RepeatedStratifiedKFold
        # (n_splits=10, n_repeats=10), which requires ≥10 samples per class.
        # 20 subjects → 10 high-EF + 10 low-EF after median split → fits.
        # N=12 was tried first (cv_folds=5 minimum from config.yaml) but
        # crashed Stage 6 → Stage 5 with "n_splits=10 cannot be greater
        # than the number of members in each class".
        #
        # --duration 20 — N=20 with default 30 s timed out at 1h21m;
        # N=20 with 10 s broke Stage 1 (autoreject CV needs ≥5 surviving
        # epochs; at 10 s only 4 survive, and bad-channel detection over-
        # rejects making picks=13 < ica.n_components=14). 20 s yields 10
        # non-overlapping 2-s epochs → ≥5 survive autoreject and channel
        # correlations are stable enough to keep ICA happy. Reduces Stage 6
        # density-matrix compute ~1.5–2× vs 30 s. Real-data runs use 30+ s.
        #
        # CI is a smoke test ("does the pipeline run without crashing"),
        # not a statistical run; N=20 × 20 s is still well above the
        # structural minimum for every downstream stage.
        run: |
          python tests/generate_synthetic_fixture.py \
            --out tests/fixtures/synthetic \
            --n-subjects 20 \
            --duration 20 \
            --seed 42

      - name: Run pipeline end-to-end on fixture
        # set -o pipefail so a non-zero exit from python propagates through tail
        # (without it, tail returns 0 and masks pipeline failures as ✓).
        # SKIP_SHAP=1: SHAP tree explainer can stall on synthetic-fixture
        # inputs (observed 40+ min hang at Stage 4C with shap==0.49.1 on the
        # 28-subject gaussian-noise fixture). Real-data runs do not set this.
        # SKIP_STAGE5=1: Stage 5 fair_comparison is post-hoc statistical
        # analysis (4 cells × 100-fold CV × 1000-permutation × 10000-bootstrap
        # ≈ 1+ hour at N=20). It tests statistical inference, not pipeline
        # correctness. The previous N=20 × 30 s run was cancelled at 1h21m
        # almost entirely inside Stage 5. Skipping here keeps CI a smoke test;
        # real-data runs always execute Stage 5.
        env:
          SKIP_SHAP: '1'
          SKIP_STAGE5: '1'
        run: |
          set -o pipefail
          python run_all.py --config tests/fixtures/synthetic/config.fixture.yaml \
            2>&1 | tail -200

      - name: Regenerate figures from Stage 5 output
        # generate_figures.py requires stage5_fair_comparison.json (all
        # 3 figures it produces depend on Stage 5 outputs). When SKIP_STAGE5=1
        # that file is absent by design — skip the figure step too rather
        # than failing CI. Real-data runs always have Stage 5 outputs.
        run: |
          if [ -f tests/fixtures/synthetic/results/stage5_fair_comparison.json ]; then
            python generate_figures.py \
              --results-dir tests/fixtures/synthetic/results \
              --out-dir tests/fixtures/synthetic/figures
          else
            echo "stage5_fair_comparison.json absent (Stage 5 was skipped); skipping figure regeneration."
          fi

      - name: Upload figures as artifact
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: ci-figures
          path: tests/fixtures/synthetic/figures/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload results JSON as artifact
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: ci-results
          path: tests/fixtures/synthetic/results/*.json
          if-no-files-found: warn
          retention-days: 14
