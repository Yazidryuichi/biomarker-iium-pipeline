[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biomarker-iium"
version = "0.3.0"
description = "QEEG biomarker candidate identification pipeline for executive function in Indonesian children"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Yazid Ryuichi Habiburahman"},
    {name = "Dandy Aulya"},
]
keywords = ["EEG", "QEEG", "biomarker", "executive-function", "machine-learning", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
biomarker-iium = "run_all:main"

[tool.hatch.build.targets.wheel]
packages = ["stages", "utils"]
