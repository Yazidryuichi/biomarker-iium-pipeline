paths:
  behavioral_dir: ./data/Behavioral
  preprocessing_root: ./preprocessing/output
  validation_root: ./validation/output
  feature_building_root: ./feature_building/output
  feature_engineering_root: ./feature_engineering/output
  analysis_root: ./analysis/output
  data_quality_check_root: ./data_quality_check/output

random_state: 42

params:
  # Report language. Currently only English implemented; structure is
  # generic enough to swap by templating the section headings + prose.
  language: en

  # ──────────────────────────────────────────────────────────────
  # Project framing (for the Background / Ask sections — edit freely)
  # ──────────────────────────────────────────────────────────────
  project_title: >-
    Quantitative EEG biomarkers of executive function in Indonesian
    children aged 6-12: a feasibility report from the pilot phase
  institution: International Islamic University Malaysia (IIUM)
  collaborating_site: Talenta Center, Jakarta, Indonesia
  ethics_body: RS Soeharto Heerdjan (ethics approval, 2026)
  report_audience: |
    Internal Reviewers, Pilot Funders, and Main-Study Sponsors.
    This document presents the pilot feasibility evidence and the
    pre-registered modifications required before the main study.

  # ──────────────────────────────────────────────────────────────
  # Main study design parameters (what the pitch is asking for)
  # ──────────────────────────────────────────────────────────────
  main_study_n_target: 100
  main_study_primary_target: rt_cv
  main_study_secondary_target: ddm_v_incongruent
  retracted_targets: [ddm_delta_v, flanker_effect]

  power_assumptions:
    expected_r: 0.30                 # field-realistic for trait QEEG <-> task EF
    alpha_two_sided: 0.05
    target_power: 0.80
    # for hierarchical OLS block F-test
    delta_r2_detectable: 0.10        # what N=100 can detect at power ~0.80
    k_composites: 3

  preregistered_exclusion_rules:
    - "acc_incongruent < 0.50 (sub-chance on a 2AFC task; D0000816 in pilot)"
    - "EEG min_epochs = 60 surviving per condition per subject"
    - "Cronbach alpha < 0.50 on any composite => composite is reported but flagged construct-invalid"

  # ──────────────────────────────────────────────────────────────
  # Concrete fixes the pilot identified
  # ──────────────────────────────────────────────────────────────
  fixes:
    flanker_task: >-
      Replace or modify the Fish Flanker. Options: (a) increase flanker
      density and reduce inter-element spacing; (b) impose a response
      deadline (~800 ms); (c) replace with an adaptive-difficulty Eriksen
      flanker calibrated to keep mean accuracy at 80-85% in the target
      age range. The current task did not induce a measurable congruency
      effect in any subject and therefore cannot serve as a conflict
      probe.
    aufei_instrument: >-
      Re-anchor the AUFEI-O response scale. Current 1-4 Likert produces
      severe upward compression (WM subscale SD = 9% of range). Switch
      to (a) a 1-7 scale with concrete behavioural anchors per response
      option, or (b) frequency-based items ("how many times per week
      does the child...") that are less susceptible to parent social
      desirability. Drop IC3 (100% ceiling, zero variance) and CF2 (89%
      ceiling) from the next pilot wave.
    digit_span: >-
      Request item-level export from the testing platform (current export
      provides only summary FW/BW/Total). With item-level data, replace
      the FW-vs-BW Spearman-Brown approximation with a proper split-half
      reliability estimate.
    aperiodic_correction: >-
      Install `specparam` (or legacy `fooof`) in the analysis
      environment. The feature_building stage will then auto-build
      `psd_periodic_<band>_<ch>` columns and feature_engineering will
      add `*_periodic` sibling composites — the analysis stage already
      registers both as feature sets for sensitivity comparison. No code
      changes required.
    target_replacement: >-
      Adopt rt_cv as the primary behavioural target and ddm_v_incongruent
      as secondary. Retract ddm_delta_v and flanker_effect — both are
      difference scores and were measured here as unreliable (delta_v
      reliability not even estimable) and construct-bound to the
      currently-broken Flanker.

  # ──────────────────────────────────────────────────────────────
  # Budget / timeline placeholders — fill before circulating to donors
  # ──────────────────────────────────────────────────────────────
  budget_placeholder: |
    [TO BE FILLED by PI before donor submission. Suggested line items:
    EEG recording sessions (N=100 × IDR per session), participant
    incentive, RA time for behavioural testing, statistician analytic
    support, publication / open-access costs, contingency.]
  timeline_placeholder: |
    [TO BE FILLED by PI. Suggested phases: instrument revision (M1-M3),
    re-pilot N=30 to validate fixes (M4-M5), main wave N=100 collection
    (M6-M14), analysis + manuscript (M15-M18).]
  ask_placeholder: |
    [TO BE FILLED by PI. Funding amount, duration, and any specific
    research-output deliverables expected by the funder.]
