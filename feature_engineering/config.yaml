paths:
  behavioral_dir: ./data/Behavioral
  feature_building_root: ./feature_building/output

random_state: 42

params:
  aufei_filename: AUFEI-O_Cleaned.xlsx
  flanker_filename: Flanker_Test_Pilot.xlsx
  digit_span_filename: Digit_Span.xlsx

  assessment_date: "2026-03-09"
  min_matched_n: 20

  # AUFEI subscale composition. IC3 dropped (ceiling effect, pilot data).
  aufei_subscales:
    WM: [WM1, WM2, WM3, WM4, WM5]
    IC: [IC1, IC2, IC4, IC5]
    CF: [CF1, CF2, CF3, CF4, CF5]
    P:  [P1,  P2,  P3,  P4,  P5]
    SF: [SF1, SF2, SF3, SF4, SF5]

  # Math-derived composites
  tbr_channels: [Fz, F3, F4, Cz]
  faa_left: F3
  faa_right: F4
  posterior_alpha_channels: [O1, O2, Pz]

  # A priori UNION (primary feature set; 9 region-collapsed composites).
  # Channel collapsing reflects 15-ch Mitsar availability:
  #   FC = {Fz, Cz}              FCz absent
  #   PO = {O1, O2, Pz}          POz absent
  apriori_union_fc_channels: [Fz, Cz]
  apriori_union_po_channels: [O1, O2, Pz]

  # Legacy Tier-1 (3 composites; kept as a sensitivity comparison feature set).
  # The UNION above supersedes these for primary analysis.
  apriori_fm_theta_channels: [Fz, F3, F4]
  apriori_posterior_alpha_channels: [Pz, P3, P4, O1, O2]
  apriori_tbr_frontal_channels: [Fz, F3, F4]

  # When feature_building emitted psd_periodic_* columns, also build periodic
  # versions of the (legacy) Tier-1 composites for sensitivity analysis.
  build_periodic_composites: true

  # Targets referenced when emitting apriori_theory_mapping.csv (per-target
  # directional prior table). Primary first.
  targets_for_theory_mapping: [rt_cv, ddm_v_incongruent, BW_Span, Global_EF]

  # ----- Feature selection schemes (declaration) -----
  # Membership / pool definitions live HERE. Selector application (L1
  # embedded, SelectKBest, direct fit) happens INSIDE the CV folds at the
  # analysis stage to avoid leakage.
  feature_selection_schemes:
    # Unsupervised curation runs once before the CV split (it cannot leak
    # because no target information is used). Drops near-constant + tightly
    # collinear columns; produces the curated pool used by data_driven /
    # hybrid schemes.
    unsupervised_curation:
      enable: true
      variance_threshold: 1.0e-6
      collinearity_threshold: 0.95
    # The three schemes the analysis stage will run. Resolved column lists
    # are emitted to feature_selection_schemes_resolved.json so the analysis
    # stage reads the explicit membership rather than re-computing it.
    schemes:
      theory:
        description: "9 a priori union composites; direct fit, no selection"
        members: apriori_union
      data_driven:
        description: "Full curated pool; L1 embedded (ElasticNet) does selection inside CV"
        members: curated_pool
      hybrid:
        description: "9 a priori always in; L1 on rest_pool with k<=10 cap inside CV"
        apriori_members: apriori_union
        rest_members: curated_pool_minus_apriori
